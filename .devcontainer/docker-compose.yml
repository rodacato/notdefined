services:
  notdefined:
    container_name: notdefined
    build:
      context: .
      dockerfile: Dockerfile
    # tini como PID 1 — `sleep infinity` nunca hace reap, así que los zombies
    # de git/node/claude se acumulan.
    init: true
    volumes:
      - ..:/workspaces/notdefined:cached
      # La feature shell-history escribe aquí (/dc/shellhistory, según su
      # devcontainer-feature.json); sin el volumen cada rebuild empieza vacío.
      - bashhistory:/dc/shellhistory
      - npmcache:/home/node/.npm
      - rubygems:/usr/local/rvm/gems
    # .host.env comes from initialize.sh, local.env from you; the later file wins. See README.md.
    env_file:
      - path: .host.env
        required: false
      - path: local.env
        required: false
    command: sleep infinity

volumes:
  bashhistory:
  npmcache:
  rubygems:
