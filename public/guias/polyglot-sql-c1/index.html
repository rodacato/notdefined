// Tema antes del primer paint: sin flash de claro.
(function () {
  var guardado = null;
  try { guardado = localStorage.getItem("guia-tema"); } catch (e) {}
  var modo = guardado || "dark";
  var oscuro = modo === "dark" || (modo === "system" &&
    window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", oscuro);
})();
</script>
