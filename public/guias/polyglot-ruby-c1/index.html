<link rel="stylesheet" href="./styles.css">
<script>
  /* Tema antes del primer paint: evita el flash de claro. Default dark. */
  (function () {
    var valor;
    try { valor = localStorage.getItem('guia-tema'); } catch (e) { valor = null; }
    if (!valor) valor = 'dark';
    var oscuro = valor === 'dark' ||
      (valor === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', oscuro);
  })();
</script>
